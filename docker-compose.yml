services:
  db:
    image: postgres:17
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon_dev_password
      POSTGRES_DB: salon_booking
    ports:
      - "5433:5432"
    volumes:
      - salon-pgdata:/var/lib/postgresql/data

volumes:
  salon-pgdata: